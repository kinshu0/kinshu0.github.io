# Books shown on the About page, in order. colour is the bar behind the title; chosen for how the stack looks, not from the covers.

- title: Remembrance of Earth's Past
  author: Cixin Liu
  detail: "The Three-Body Problem, The Dark Forest, Death's End"
  colour: "#7a3b2e"
  note: >-
    My favourite books. As a kid I decided the end goal of everything was travelling to distant
    galaxies, and this trilogy is the closest I've come to going.

- title: "Frieren: Beyond Journey's End"
  author: Kanehito Yamada and Tsukasa Abe
  colour: "#8a7bb8"
  note: >-
    Manga. The magic has rules, a history and people who study it like a science. I'd want to be a
    mage there.

- title: "Surely You're Joking, Mr. Feynman!"
  author: Richard Feynman
  colour: "#c9952b"
  note: >-
    How I'd like to learn: casually, out of plain curiosity, and happy to ask the naive question.

- title: The Mental Game of Poker
  author: Jared Tendler
  colour: "#2f6b4f"
  note: >-
    Not about the maths. It's about how boredom, fear and tilt wreck your judgement, and it described
    my years of track and cross country better than any running book did. Its inchworm idea stuck with
    me: you get better by pulling your worst play forward, not by polishing your best.

- title: Attack on Titan
  author: Hajime Isayama
  colour: "#3d3d3d"
  note: >-
    Manga. Nobody in it is simply right, and one person's sheer will carries the whole story.

- title: Piranesi
  author: Susanna Clarke
  colour: "#6b8aa6"
  note: >-
    A puzzle of a book. I liked not knowing what the world was until the end.

- title: Grit
  author: Angela Duckworth
  colour: "#b4451f"
  note: >-
    Changed how I set goals: pick a direction on purpose, then keep working toward it.

- title: The Big Short
  author: Michael Lewis
  colour: "#1f2a44"
  note: >-
    The clearest account I've read of how mortgage-backed securities worked, and how they failed.
