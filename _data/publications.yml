- title: "What, Then, Is Critical Thinking? Insights from a Longitudinal Study of Critical Thinking"
  authors: "Michael Ben-Avie, Brian Darrow, Luke Brown, <strong>Kinshu Gupta</strong>, J. T. Torres"
  venue: "Journal of Assessment and Institutional Effectiveness, 15(1–2), 19–66, 2025"
  description: >-
    A longitudinal, mixed-methods study of how undergraduates' critical thinking develops. Papers from
    the same students, scored by outside faculty, are linked to psychological survey data to find which
    psychoeducational variables come before strong and improving performance.
  links:
    - label: paper
      url: https://doi.org/10.5325/jasseinsteffe.15.1-2.0019

- title: Explaining Pretrained Deep Neural Network MRI Cancer Classification Outcomes
  authors: "<strong>Kinshu Gupta</strong>"
  venue: "Poster, ASEE Northeast Section Conference, 2024"
  description: >-
    Uses input gradients to show which regions of a prostate MRI lesion drive a pretrained VGG-16's
    malignancy prediction, on the ProstateX dataset, as a check that the model attends to clinically
    relevant features.
  links:
    - label: poster
      url: /files/xai-presentation.pdf

