# Builds the site and publishes it to kinshu.co (S3 behind CloudFront) on every push to main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134625518097:role/kinshu-co-deploy
          aws-region: us-east-1
      - run: aws s3 sync _site s3://kinshu-co-site-134625518097 --delete
      - run: aws cloudfront create-invalidation --distribution-id ETYISTQ4KFY6F --paths "/*"
